<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaResearch Live Board</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (브라우저에서 JSX 컴파일) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 기업용 깔끔한 폰트 (Pretendard) 추가 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    body { font-family: 'Pretendard', -apple-system, sans-serif; }
    
    @keyframes stickIt {
      0% { transform: scale(1.1) rotate(5deg); opacity: 0; filter: blur(2px); }
      50% { transform: scale(0.98) rotate(-1deg); opacity: 1; filter: blur(0px); }
      100% { transform: scale(1) rotate(var(--rotation)); opacity: 1; }
    }
    @keyframes likePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); color: #f43f5e; } 
      100% { transform: scale(1); }
    }
    @keyframes floatUp {
      0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -150px) scale(1.5); opacity: 0; }
    }
    
    .animate-stick-it { animation: stickIt 0.4s ease-out forwards; }
    .animate-like-pop { animation: likePop 0.3s ease-out; }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 m-0 p-0 overflow-hidden h-screen w-screen">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // =====================================================================
    // GitHub 설정 (실제 토큰이 무효화되었다면 새로 발급받아 입력해주세요)
    // =====================================================================
    const GITHUB_OWNER = "sunghyun1003"; 
    const GITHUB_REPO = "pr";        
    const TOKEN_PART_1 = "ghp_khDbGMZTeisRu8qRB"; 
    const TOKEN_PART_2 = "FTXN4Yi1snyPD1DhrvI"; 
    const GITHUB_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
    // =====================================================================

    const fetchGitHubAPI = async (path, method = "GET", body = null) => {
      // 캐시 방지용 타임스탬프
      const urlPath = path.includes('?') ? `${path}&t=${Date.now()}` : `${path}?t=${Date.now()}`;
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}${urlPath}`;
      
      const headers = {
        "Accept": "application/vnd.github.v3+json",
        "Authorization": `Bearer ${GITHUB_TOKEN}` // Bearer 표준 방식으로 변경
      };
      
      const options = { method, headers };
      if (body) options.body = JSON.stringify(body);

      try {
        const response = await fetch(url, options);
        
        if (response.status === 401) {
          throw new Error("토큰이 무효화되었습니다. GitHub에서 새 토큰을 발급받아주세요.");
        }
        if (response.status === 403) {
          throw new Error("API 호출 한도를 초과했거나 권한이 없습니다.");
        }
        if (!response.ok) {
          throw new Error(`API 오류: ${response.status}`);
        }
        
        return await response.json();
      } catch (err) {
        // 네트워크 연결 실패 시 에러 재발생
        throw err;
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('mobile'); 
      const [comments, setComments] = useState([]);
      const [isMobileScreen, setIsMobileScreen] = useState(window.innerWidth < 768);
      const [userId, setUserId] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        let storedUserId = localStorage.getItem('workshop_user_id');
        if (!storedUserId) {
          storedUserId = 'user_' + Math.random().toString(36).substr(2, 9);
          localStorage.setItem('workshop_user_id', storedUserId);
        }
        setUserId(storedUserId);

        const handleResize = () => setIsMobileScreen(window.innerWidth < 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const loadComments = useCallback(async () => {
        if(!GITHUB_TOKEN || GITHUB_TOKEN.includes("YOUR_TOKEN")) return;

        try {
          const issues = await fetchGitHubAPI("/issues?state=open&per_page=100&sort=created&direction=desc");
          setErrorMsg(''); // 성공 시 에러 메시지 초기화
          
          const formattedComments = issues.map((issue) => {
            const likesCount = issue.reactions ? issue.reactions.heart : 0;
            return {
              id: issue.number.toString(),
              nickname: issue.title || "익명",
              content: issue.body || "",
              likes: likesCount,
              likedBy: [], 
            };
          });

          setComments(prev => {
            return formattedComments.map(newC => {
              const oldC = prev.find(p => p.id === newC.id);
              if (oldC) {
                return { ...newC, style: oldC.style, likedBy: oldC.likedBy };
              } else {
                return {
                  ...newC,
                  style: {
                    rotation: Math.random() * 4 - 2, 
                    colorIndex: Math.floor(Math.random() * 5),
                    scale: 1,
                    left: Math.random() * 70 + 5,
                    top: Math.random() * 60 + 10,
                  }
                };
              }
            });
          });
        } catch (error) {
          console.error("데이터 동기화 실패:", error);
          setErrorMsg(error.message || "연결 오류가 발생했습니다.");
        }
      }, []);

      useEffect(() => {
        loadComments();
        const intervalTime = activeTab === 'screen' ? 2500 : 10000;
        const interval = setInterval(loadComments, intervalTime);
        return () => clearInterval(interval);
      }, [loadComments, activeTab]);


      const addComment = async (nickname, content) => {
        const tempId = "temp_" + Date.now();
        const newComment = {
          id: tempId, nickname: nickname || '익명', content, likes: 0, likedBy: [],
          style: { rotation: Math.random() * 4 - 2, colorIndex: Math.floor(Math.random() * 5), scale: 1, left: Math.random() * 70 + 5, top: Math.random() * 60 + 10 }
        };
        
        setComments(prev => [newComment, ...prev]);

        try {
          await fetchGitHubAPI("/issues", "POST", {
            title: nickname || "익명",
            body: content
          });
          loadComments();
        } catch(e) { 
          alert(e.message || "글 등록에 실패했습니다."); 
          setComments(prev => prev.filter(c => c.id !== tempId));
        }
      };

      const toggleLike = async (id) => {
        const target = comments.find(c => c.id === id);
        if(!target || target.likedBy.includes(userId)) return;

        setComments(prev => prev.map(c => c.id === id ? { ...c, likes: c.likes + 1, likedBy: [...c.likedBy, userId] } : c));

        if(!id.startsWith("temp_")) {
          try {
            await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues/${id}/reactions`, {
              method: "POST",
              headers: {
                "Accept": "application/vnd.github.squirrel-girl-preview+json", 
                "Authorization": `Bearer ${GITHUB_TOKEN}`
              },
              body: JSON.stringify({ content: "heart" })
            });
          } catch(e) { console.error("좋아요 실패", e); }
        }
      };

      const clearComments = async () => {
        if(!confirm("모든 데이터를 초기화하시겠습니까?")) return;
        setComments([]);
        try {
           const issues = await fetchGitHubAPI("/issues?state=open");
           for(const issue of issues) {
             await fetchGitHubAPI(`/issues/${issue.number}`, "PATCH", { state: "closed" });
           }
           alert("초기화 완료");
        } catch(e) { alert("삭제 실패: " + e.message); }
      };

      return (
        <div className="flex flex-col h-full w-full select-none bg-slate-900">
          {errorMsg && (
            <div className="bg-amber-500 text-white p-2 text-center text-xs font-bold z-[100] animate-pulse">
              ⚠️ {errorMsg}
            </div>
          )}

          <div className="flex-1 overflow-hidden relative bg-slate-50">
            {activeTab === 'mobile' && <MobileView addComment={addComment} />}
            {activeTab === 'screen' && <ScreenView comments={comments} toggleLike={toggleLike} isMobileScreen={isMobileScreen} userId={userId} />}
            {activeTab === 'admin' && <AdminView clearComments={clearComments} />}
          </div>

          <div className="bg-slate-900 flex justify-around p-2 pb-6 z-50 border-t border-slate-800">
            <button onClick={() => setActiveTab('mobile')} className={`flex flex-col items-center p-2 rounded-xl flex-1 transition-colors ${activeTab === 'mobile' ? 'text-emerald-400 bg-slate-800' : 'text-slate-500'}`}>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
              <span className="text-[11px] font-bold">의견 등록</span>
            </button>
            <button onClick={() => setActiveTab('screen')} className={`flex flex-col items-center p-2 rounded-xl flex-1 transition-colors ${activeTab === 'screen' ? 'text-teal-400 bg-slate-800' : 'text-slate-500'}`}>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
              <span className="text-[11px] font-bold">라이브 보드</span>
            </button>
            <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center p-2 rounded-xl flex-1 transition-colors ${activeTab === 'admin' ? 'text-slate-300 bg-slate-800' : 'text-slate-500'}`}>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
              <span className="text-[11px] font-bold">관리자</span>
            </button>
          </div>
        </div>
      );
    }

    function MobileView({ addComment }) {
      const [nickname, setNickname] = useState('');
      const [content, setContent] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!content.trim()) return;
        setIsSubmitting(true);
        addComment(nickname, content);
        setContent('');
        setIsSubmitting(false);
      };

      return (
        <div className="h-full w-full flex flex-col items-center justify-start p-4 bg-slate-50 overflow-y-auto">
          <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-sm border border-slate-200 mt-4">
            <div className="text-center mb-8 border-b border-slate-100 pb-6">
              <h2 className="text-2xl font-black text-slate-800 mb-2">자유 의견 등록</h2>
              <p className="text-sm text-slate-500">전광판 화면에 실시간으로 반영됩니다.</p>
            </div>
            <form onSubmit={handleSubmit} className="flex flex-col gap-5">
              <div className="flex flex-col gap-2">
                <label className="text-xs font-bold text-slate-500 uppercase ml-1">작성자</label>
                <input type="text" placeholder="익명" value={nickname} onChange={e=>setNickname(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 text-sm" maxLength={10} />
              </div>
              <div className="flex flex-col gap-2">
                <label className="text-xs font-bold text-slate-500 uppercase ml-1">의견</label>
                <textarea placeholder="의견을 남겨주세요." value={content} onChange={e=>setContent(e.target.value)} className="w-full p-4 h-36 bg-slate-50 border border-slate-200 rounded-xl outline-none resize-none focus:ring-2 focus:ring-emerald-500 text-sm leading-relaxed" required />
              </div>
              <button type="submit" disabled={isSubmitting || !content.trim()} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-4 rounded-xl active:scale-95 transition-all disabled:bg-slate-200 shadow-md">
                {isSubmitting ? '전송 중...' : '보드에 등록하기'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function ScreenView({ comments, toggleLike, isMobileScreen, userId }) {
      const colors = [
        'bg-white border-t-4 border-t-emerald-500 border-x border-b border-slate-200',
        'bg-white border-t-4 border-t-teal-500 border-x border-b border-slate-200',
        'bg-white border-t-4 border-t-blue-500 border-x border-b border-slate-200',
        'bg-slate-50 border-t-4 border-t-emerald-400 border-x border-b border-slate-200',
        'bg-slate-50 border-t-4 border-t-teal-400 border-x border-b border-slate-200'
      ];

      if (isMobileScreen) {
        return (
          <div className="h-full flex flex-col w-full bg-slate-50">
            <div className="bg-emerald-600 p-4 shadow-sm text-center">
              <h2 className="font-bold text-white">의견 리스트</h2>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {comments.map(c => {
                 const hasLiked = c.likedBy.includes(userId);
                 return (
                  <div key={c.id} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200" onDoubleClick={() => toggleLike(c.id)}>
                    <span className="font-bold text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded-md mb-2 block w-fit">@ {c.nickname}</span>
                    <p className="text-slate-800 font-medium leading-relaxed mb-4">{c.content}</p>
                    <div className="flex justify-between items-center border-t border-slate-100 pt-3">
                      <span className="text-[11px] text-slate-400">더블클릭 공감</span>
                      <button onClick={(e) => { e.stopPropagation(); toggleLike(c.id); }} className={`px-4 py-1.5 rounded-full text-sm font-bold ${hasLiked ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-500'}`}>
                        {hasLiked ? '💚' : '🤍'} {c.likes}
                      </button>
                    </div>
                  </div>
                )
              })}
            </div>
          </div>
        );
      }

      return (
        <div className="h-full bg-slate-900 overflow-hidden relative flex flex-col w-full">
          <div className="p-8 z-20 pointer-events-none border-b border-slate-800/50 bg-slate-900/80 backdrop-blur-sm flex justify-between items-center">
            <div>
              <h1 className="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400 tracking-tight mb-2">
                PharmaResearch Live Board
              </h1>
              <span className="text-slate-400 font-medium">실시간 자유 의견 공간 (총 {comments.length}건)</span>
            </div>
          </div>

          <div className="flex-1 relative overflow-hidden z-10 w-full h-full bg-slate-50/5">
            {comments.map((c) => {
              const style = c.style || { rotation: 0, colorIndex: 0, scale: 1, left: 50, top: 50 };
              const colorClass = colors[style.colorIndex];
              const hasLiked = c.likedBy.includes(userId);

              return (
                <div key={c.id} onDoubleClick={() => toggleLike(c.id)} className={`absolute animate-stick-it shadow-2xl p-6 rounded-xl flex flex-col justify-between ${colorClass} hover:z-50 transition-all cursor-pointer`}
                  style={{ '--rotation': `${style.rotation}deg`, left: `${style.left}%`, top: `${style.top}%`, transform: `scale(${style.scale}) rotate(${style.rotation}deg)`, width: '320px', minHeight: '160px' }}>
                  
                  <p className="text-xl font-bold leading-relaxed break-words relative z-10 mb-6 text-slate-800 whitespace-pre-wrap">"{c.content}"</p>
                  
                  <div className="flex justify-between items-center pt-4 border-t border-slate-200/60 relative z-10 mt-auto">
                    <span className="font-bold text-sm text-slate-500 truncate bg-slate-100 px-2 py-1 rounded-md">@ {c.nickname}</span>
                    <button onClick={(e) => { e.stopPropagation(); toggleLike(c.id); }} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold ${hasLiked ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600'}`}>
                      {hasLiked ? '💚' : '🤍'} <span>{c.likes}</span>
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function AdminView({ clearComments }) {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [pin, setPin] = useState('');

      if (!isAuthenticated) {
        return (
          <div className="h-full bg-slate-100 p-5 flex items-center justify-center">
            <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-sm text-center">
              <h1 className="text-xl font-black text-slate-800 mb-6">관리자 로그인</h1>
              <form onSubmit={(e) => { e.preventDefault(); if(pin==='12345678') setIsAuthenticated(true); else alert('실패'); }} className="flex flex-col gap-4">
                <input type="password" placeholder="PIN" value={pin} onChange={e => setPin(e.target.value)} className="w-full p-4 border rounded-xl text-center text-xl tracking-[0.5em]" />
                <button type="submit" className="w-full bg-slate-800 text-white p-4 rounded-xl">접속</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="h-full bg-slate-100 p-5 flex items-center justify-center">
          <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-sm text-center">
            <h1 className="text-2xl font-black mb-8">제어판</h1>
            <button onClick={clearComments} className="w-full p-4 bg-rose-600 text-white font-bold rounded-xl shadow-md">데이터 초기화</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
