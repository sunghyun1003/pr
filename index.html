<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaResearch Live Board</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (브라우저에서 JSX 컴파일) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 기업용 깔끔한 폰트 (Pretendard) 추가 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    body { font-family: 'Pretendard', -apple-system, sans-serif; }
    
    @keyframes stickIt {
      0% { transform: scale(1.1) rotate(5deg); opacity: 0; filter: blur(2px); }
      50% { transform: scale(0.98) rotate(-1deg); opacity: 1; filter: blur(0px); }
      100% { transform: scale(1) rotate(var(--rotation)); opacity: 1; }
    }
    @keyframes likePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); color: #f43f5e; } 
      100% { transform: scale(1); }
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(10px); }
      10% { opacity: 1; transform: translateY(0); }
      90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    
    .animate-stick-it { animation: stickIt 0.4s ease-out forwards; }
    .animate-like-pop { animation: likePop 0.3s ease-out; }
    .animate-feedback { animation: fadeInOut 3s ease-in-out forwards; }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 m-0 p-0 overflow-hidden h-screen w-screen">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // =====================================================================
    // GitHub 설정
    // =====================================================================
    const GITHUB_OWNER = "sunghyun1003"; 
    const GITHUB_REPO = "pr";        
    const TOKEN_PART_1 = "ghp_khDbGMZTeisRu8qRB"; 
    const TOKEN_PART_2 = "FTXN4Yi1snyPD1DhrvI"; 
    const GITHUB_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
    // =====================================================================

    const fetchGitHubAPI = async (path, method = "GET", body = null) => {
      const urlPath = path.includes('?') ? `${path}&t=${Date.now()}` : `${path}?t=${Date.now()}`;
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}${urlPath}`;
      const headers = {
        "Accept": "application/vnd.github.v3+json",
        "Authorization": `Bearer ${GITHUB_TOKEN}`
      };
      const options = { method, headers };
      if (body) options.body = JSON.stringify(body);

      try {
        const response = await fetch(url, options);
        if (response.status === 401) throw new Error("토큰 만료");
        if (!response.ok) throw new Error(`API 오류: ${response.status}`);
        return await response.json();
      } catch (err) { throw err; }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('mobile'); 
      const [comments, setComments] = useState([]);
      const [isMobileScreen, setIsMobileScreen] = useState(window.innerWidth < 768);
      const [userId, setUserId] = useState('');
      const [successMsg, setSuccessMsg] = useState(false);

      useEffect(() => {
        let storedUserId = localStorage.getItem('workshop_user_id');
        if (!storedUserId) {
          storedUserId = 'user_' + Math.random().toString(36).substr(2, 9);
          localStorage.setItem('workshop_user_id', storedUserId);
        }
        setUserId(storedUserId);
        const handleResize = () => setIsMobileScreen(window.innerWidth < 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // 겹침 방지 위치 계산 로직
      const findSafePosition = (existingItems) => {
        const cardW = 22; // 카드가 차지할 예상 너비 (vw)
        const cardH = 22; // 카드가 차지할 예상 높이 (vh)
        const maxAttempts = 100;
        
        for (let i = 0; i < maxAttempts; i++) {
          const x = Math.random() * (90 - cardW) + 5;
          const y = Math.random() * (80 - cardH) + 10;
          
          let collision = false;
          for (const item of existingItems) {
            if (!item.style) continue;
            const buffer = 2; // 최소 간격 유지용 버퍼
            if (
              x < item.style.left + cardW + buffer &&
              x + cardW + buffer > item.style.left &&
              y < item.style.top + cardH + buffer &&
              y + cardH + buffer > item.style.top
            ) {
              collision = true;
              break;
            }
          }
          if (!collision) return { left: x, top: y };
        }
        // 자리가 없으면 그냥 랜덤
        return { left: Math.random() * 65 + 10, top: Math.random() * 60 + 15 };
      };

      const loadComments = useCallback(async () => {
        if(!GITHUB_TOKEN || GITHUB_TOKEN.includes("YOUR_TOKEN")) return;
        try {
          const issues = await fetchGitHubAPI("/issues?state=open&per_page=100&sort=created&direction=desc");
          setComments(prev => {
            return issues.map((issue) => {
              const likesCount = issue.reactions ? issue.reactions.heart : 0;
              const old = prev.find(p => p.id === issue.number.toString());
              if (old) {
                return { ...old, likes: likesCount };
              } else {
                const pos = findSafePosition(prev);
                return {
                  id: issue.number.toString(),
                  nickname: issue.title || "익명",
                  content: issue.body || "",
                  likes: likesCount,
                  likedBy: [],
                  style: {
                    rotation: Math.random() * 4 - 2,
                    colorIndex: Math.floor(Math.random() * 5),
                    ...pos
                  }
                };
              }
            });
          });
        } catch (error) { console.error(error); }
      }, []);

      useEffect(() => {
        loadComments();
        const intervalTime = activeTab === 'screen' ? 2500 : 10000;
        const interval = setInterval(loadComments, intervalTime);
        return () => clearInterval(interval);
      }, [loadComments, activeTab]);

      const addComment = async (nickname, content) => {
        const tempId = "temp_" + Date.now();
        setComments(prev => [{
          id: tempId, nickname: nickname || '익명', content, likes: 0, likedBy: [],
          style: { rotation: 0, colorIndex: 0, ...findSafePosition(prev) }
        }, ...prev]);
        
        try {
          await fetchGitHubAPI("/issues", "POST", { title: nickname || "익명", body: content });
          setSuccessMsg(true); // 성공 메시지 표시
          setTimeout(() => setSuccessMsg(false), 3100);
          loadComments();
        } catch(e) { 
          alert("등록 실패");
          setComments(prev => prev.filter(c => c.id !== tempId));
        }
      };

      const toggleLike = async (id) => {
        const target = comments.find(c => c.id === id);
        if(!target || target.likedBy.includes(userId)) return;
        setComments(prev => prev.map(c => c.id === id ? { ...c, likes: c.likes + 1, likedBy: [...c.likedBy, userId] } : c));
        if(!id.startsWith("temp_")) {
          try {
            await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues/${id}/reactions`, {
              method: "POST",
              headers: { "Accept": "application/vnd.github.squirrel-girl-preview+json", "Authorization": `Bearer ${GITHUB_TOKEN}` },
              body: JSON.stringify({ content: "heart" })
            });
          } catch(e) {}
        }
      };

      return (
        <div className="flex flex-col h-full w-full select-none bg-slate-900 relative">
          {successMsg && (
            <div className="absolute top-10 left-1/2 -translate-x-1/2 z-[200] w-[90%] max-w-sm">
              <div className="bg-emerald-600 text-white p-4 rounded-2xl shadow-2xl border border-emerald-400 text-center animate-feedback">
                <p className="font-bold">의견이 등록되었습니다! 🚀</p>
                <p className="text-xs opacity-90 mt-1">곧 전광판 화면에 나타납니다.</p>
              </div>
            </div>
          )}

          <div className="flex-1 overflow-hidden relative bg-slate-50">
            {activeTab === 'mobile' && <MobileView addComment={addComment} />}
            {activeTab === 'screen' && <ScreenView comments={comments} toggleLike={toggleLike} isMobileScreen={isMobileScreen} userId={userId} />}
            {activeTab === 'admin' && <AdminView clearComments={() => {
              if(confirm("초기화?")) {
                setComments([]);
                fetchGitHubAPI("/issues?state=open").then(issues => {
                  issues.forEach(i => fetchGitHubAPI(`/issues/${i.number}`, "PATCH", { state: "closed" }));
                });
              }
            }} />}
          </div>

          <div className="bg-slate-900 flex justify-around p-2 pb-6 z-50 border-t border-slate-800">
            <button onClick={() => setActiveTab('mobile')} className={`flex flex-col items-center p-2 rounded-xl flex-1 ${activeTab === 'mobile' ? 'text-emerald-400' : 'text-slate-500'}`}>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
              <span className="text-[10px] font-bold">의견 등록</span>
            </button>
            <button onClick={() => setActiveTab('screen')} className={`flex flex-col items-center p-2 rounded-xl flex-1 ${activeTab === 'screen' ? 'text-teal-400' : 'text-slate-500'}`}>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
              <span className="text-[10px] font-bold">라이브 보드</span>
            </button>
            <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center p-2 rounded-xl flex-1 ${activeTab === 'admin' ? 'text-slate-300' : 'text-slate-500'}`}>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>
              <span className="text-[10px] font-bold">관리자</span>
            </button>
          </div>
        </div>
      );
    }

    function MobileView({ addComment }) {
      const [nickname, setNickname] = useState('');
      const [content, setContent] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!content.trim()) return;
        setIsSubmitting(true);
        addComment(nickname, content).then(() => {
          setContent('');
          setIsSubmitting(false);
        });
      };
      return (
        <div className="h-full w-full flex flex-col items-center justify-start p-6 bg-slate-50 overflow-y-auto">
          <div className="w-full max-w-md bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200 mt-4">
            <div className="text-center mb-10 pb-6 border-b border-slate-100">
              <h2 className="text-2xl font-black text-slate-800 mb-2">워크샵 의견 제안</h2>
              <p className="text-sm text-slate-400">자유롭게 의견을 남겨주세요.</p>
            </div>
            <form onSubmit={handleSubmit} className="flex flex-col gap-6">
              <div className="flex flex-col gap-2">
                <label className="text-[11px] font-bold text-emerald-600 uppercase tracking-widest ml-1">작성자</label>
                <input type="text" placeholder="익명" value={nickname} onChange={e=>setNickname(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 text-sm transition-all" maxLength={10} />
              </div>
              <div className="flex flex-col gap-2">
                <label className="text-[11px] font-bold text-emerald-600 uppercase tracking-widest ml-1">의견 내용</label>
                <textarea placeholder="함께 나누고 싶은 이야기를 적어주세요." value={content} onChange={e=>setContent(e.target.value)} className="w-full p-4 h-40 bg-slate-50 border border-slate-200 rounded-2xl outline-none resize-none focus:ring-2 focus:ring-emerald-500 text-sm leading-relaxed transition-all" required />
              </div>
              <button type="submit" disabled={isSubmitting || !content.trim()} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-5 rounded-2xl active:scale-95 transition-all disabled:bg-slate-200 shadow-xl shadow-emerald-900/10 mt-2">
                {isSubmitting ? '전송 중...' : '전광판에 게시하기'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function ScreenView({ comments, toggleLike, isMobileScreen, userId }) {
      const colors = [
        'bg-white border-t-4 border-t-emerald-500 shadow-emerald-900/5',
        'bg-white border-t-4 border-t-teal-500 shadow-teal-900/5',
        'bg-white border-t-4 border-t-blue-500 shadow-blue-900/5',
        'bg-slate-50 border-t-4 border-t-emerald-400 shadow-emerald-900/5',
        'bg-slate-50 border-t-4 border-t-teal-400 shadow-teal-900/5'
      ];
      if (isMobileScreen) {
        return (
          <div className="h-full flex flex-col w-full bg-slate-50">
            <div className="bg-emerald-600 p-5 shadow-lg text-center"><h2 className="font-bold text-white tracking-widest uppercase text-sm">전체 의견 리스트</h2></div>
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {comments.map(c => (
                <div key={c.id} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200" onDoubleClick={() => toggleLike(c.id)}>
                  <span className="font-bold text-[10px] text-slate-400 bg-slate-100 px-2 py-1 rounded-full mb-3 inline-block">@ {c.nickname}</span>
                  <p className="text-slate-800 font-medium leading-relaxed mb-4">{c.content}</p>
                  <div className="flex justify-between items-center border-t border-slate-50 pt-3">
                    <span className="text-[10px] text-slate-300">더블클릭 공감</span>
                    <button onClick={(e) => { e.stopPropagation(); toggleLike(c.id); }} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${c.likedBy.includes(userId) ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-500'}`}>
                      {c.likedBy.includes(userId) ? '💚' : '🤍'} {c.likes}
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }
      return (
        <div className="h-full bg-slate-900 overflow-hidden relative flex flex-col w-full">
          <div className="p-8 z-20 border-b border-slate-800/50 bg-slate-900/90 backdrop-blur flex justify-between items-center">
            <div>
              <h1 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-400 tracking-tighter mb-1 uppercase">PharmaResearch Live</h1>
              <span className="text-slate-500 font-bold text-sm tracking-widest uppercase opacity-70">Workshop Feedback Board ({comments.length})</span>
            </div>
          </div>
          <div className="flex-1 relative overflow-hidden z-10 w-full h-full bg-slate-950/20">
            {comments.map((c) => {
              const style = c.style || { rotation: 0, colorIndex: 0, left: 50, top: 50 };
              return (
                <div key={c.id} onDoubleClick={() => toggleLike(c.id)} className={`absolute animate-stick-it shadow-2xl p-7 rounded-2xl flex flex-col justify-between ${colors[style.colorIndex]} hover:z-50 transition-all cursor-pointer border border-slate-200/50`}
                  style={{ '--rotation': `${style.rotation}deg`, left: `${style.left}%`, top: `${style.top}%`, transform: `rotate(${style.rotation}deg)`, width: '330px', minHeight: '170px' }}>
                  <p className="text-xl font-bold leading-snug break-words text-slate-800 mb-6">"{c.content}"</p>
                  <div className="flex justify-between items-center pt-4 border-t border-slate-100 mt-auto">
                    <span className="font-bold text-xs text-slate-400 truncate bg-slate-50 px-2 py-1 rounded-lg">@ {c.nickname}</span>
                    <button onClick={(e) => { e.stopPropagation(); toggleLike(c.id); }} className={`flex items-center gap-2 hover:scale-110 px-3 py-1.5 rounded-full text-sm font-bold transition-all ${c.likedBy.includes(userId) ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}`}>
                      {c.likedBy.includes(userId) ? '💚' : '🤍'} <span className={c.likedBy.includes(userId) ? 'text-white' : 'text-slate-600'}>{c.likes}</span>
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function AdminView({ clearComments }) {
      const [pin, setPin] = useState('');
      const [auth, setAuth] = useState(false);
      if (!auth) return (
        <div className="h-full flex items-center justify-center p-6"><div className="bg-white p-10 rounded-[3rem] shadow-xl text-center w-full max-w-sm">
          <h1 className="text-xl font-black mb-8">ADMIN LOGIN</h1>
          <input type="password" placeholder="PIN" value={pin} onChange={e=>setPin(e.target.value)} className="w-full p-5 bg-slate-50 rounded-2xl text-center text-2xl tracking-[0.5em] mb-4 border border-slate-100 focus:ring-2 focus:ring-emerald-500 outline-none" />
          <button onClick={() => pin === '12345678' ? setAuth(true) : alert('틀림')} className="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold">ENTER</button>
        </div></div>
      );
      return (
        <div className="h-full flex items-center justify-center p-6 text-center"><div className="max-w-sm w-full bg-white p-10 rounded-[3rem] shadow-xl">
          <h1 className="text-2xl font-black mb-10 uppercase tracking-widest">Control Panel</h1>
          <button onClick={clearComments} className="w-full p-6 bg-rose-500 text-white font-bold rounded-2xl shadow-lg shadow-rose-900/20 active:scale-95 transition-all">DATA RESET</button>
        </div></div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
