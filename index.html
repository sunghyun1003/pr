<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PharmaResearch Live Board</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    body { 
      font-family: 'Pretendard', -apple-system, sans-serif; 
      background-color: #0f172a; 
      color: #f8fafc;
      margin: 0; padding: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    
    /* 카드 등장 애니메이션 */
    @keyframes cardSlideUp {
      0% { transform: translateY(30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* 하트가 떨어지는 애니메이션 */
    @keyframes heartRain {
      0% { transform: translateY(-20px) scale(0); opacity: 0; }
      20% { opacity: 1; transform: translateY(0) scale(1.2); }
      100% { transform: translateY(150px) scale(0.8); opacity: 0; }
    }

    /* 토스트 알림 */
    @keyframes toastSlide {
      0% { transform: translate(-50%, -120%); opacity: 0; }
      15%, 85% { transform: translate(-50%, 20px); opacity: 1; }
      100% { transform: translate(-50%, -120%); opacity: 0; }
    }
    
    .animate-card { animation: cardSlideUp 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .animate-toast { animation: toastSlide 3s ease-in-out forwards; }
    
    .falling-heart {
      position: absolute;
      pointer-events: none;
      animation: heartRain 1.2s ease-in forwards;
      z-index: 100;
      font-size: 24px;
    }

    .hide-scroll::-webkit-scrollbar { display: none; }
    .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
    
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="flex flex-col">
  <div id="root" class="flex-1 flex flex-col overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // =====================================================================
    // GitHub 설정 및 기본 정보
    // =====================================================================
    const GITHUB_OWNER = "sunghyun1003"; 
    const GITHUB_REPO = "pr";        
    const TOKEN_PART_1 = "ghp_khDbGMZTeisRu8qRB"; 
    const TOKEN_PART_2 = "FTXN4Yi1snyPD1DhrvI"; 
    const GITHUB_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
    const ADMIN_PIN = "1234";
    // =====================================================================

    const fetchGitHubAPI = async (path, method = "GET", body = null) => {
      const urlPath = path.includes('?') ? `${path}&t=${Date.now()}` : `${path}?t=${Date.now()}`;
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}${urlPath}`;
      const headers = {
        "Accept": "application/vnd.github.v3+json",
        "Authorization": `Bearer ${GITHUB_TOKEN}`
      };
      const options = { method, headers };
      if (body) options.body = JSON.stringify(body);

      try {
        const response = await fetch(url, options);
        if (!response.ok) throw new Error(`API Error: ${response.status}`);
        return await response.json();
      } catch (err) { throw err; }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('mobile'); 
      const [comments, setComments] = useState([]);
      const [isMobileScreen, setIsMobileScreen] = useState(window.innerWidth < 1024);
      const [userId, setUserId] = useState('');
      const [showToast, setShowToast] = useState(false);
      const [likedId, setLikedId] = useState(null);

      useEffect(() => {
        let storedUserId = localStorage.getItem('workshop_user_id');
        if (!storedUserId) {
          storedUserId = 'user_' + Math.random().toString(36).substr(2, 9);
          localStorage.setItem('workshop_user_id', storedUserId);
        }
        setUserId(storedUserId);
        const handleResize = () => setIsMobileScreen(window.innerWidth < 1024);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const loadComments = useCallback(async () => {
        if(!GITHUB_TOKEN || GITHUB_TOKEN.includes("YOUR_TOKEN")) return;
        try {
          const issues = await fetchGitHubAPI("/issues?state=open&per_page=50&sort=created&direction=asc");
          
          // 내 로컬 좋아요 목록 가져오기
          const localLikes = JSON.parse(localStorage.getItem('my_liked_posts') || '[]');

          setComments(prev => {
            return issues.map((issue) => {
              const issueId = issue.number.toString();
              // GitHub 리액션 대신 댓글(comments) 개수를 좋아요 수로 사용 (다중 사용자 누적 가능)
              let likesCount = issue.comments || 0;
              const existing = prev.find(p => p.id === issueId);
              
              // 내가 방금 눌렀는데 아직 API에 반영 안 된 경우 보정
              if (localLikes.includes(issueId) && likesCount === 0) {
                likesCount = 1;
              }
              
              if (existing && likesCount > existing.likes) {
                 setLikedId(existing.id);
                 setTimeout(() => setLikedId(null), 1000);
              }

              return {
                id: issueId,
                nickname: issue.title || "익명",
                content: issue.body || "",
                likes: likesCount,
                likedBy: localLikes.includes(issueId) ? [userId] : [],
                style: {
                  colorIndex: issue.number % 5,
                }
              };
            });
          });
        } catch (error) { console.error(error); }
      }, [userId]);

      useEffect(() => {
        loadComments();
        const intervalTime = activeTab === 'screen' ? 2000 : 8000;
        const interval = setInterval(loadComments, intervalTime);
        return () => clearInterval(interval);
      }, [loadComments, activeTab]);

      const addComment = async (nickname, content) => {
        try {
          await fetchGitHubAPI("/issues", "POST", { title: nickname || "익명", body: content });
          setShowToast(true);
          setTimeout(() => setShowToast(false), 3100);
          loadComments();
        } catch(e) { alert("전송 실패"); }
      };

      const toggleLike = async (id) => {
        const localLikes = JSON.parse(localStorage.getItem('my_liked_posts') || '[]');
        if(localLikes.includes(id)) return; // 이미 누름
        
        // 로컬 저장소 기록
        const updatedLikes = [...localLikes, id];
        localStorage.setItem('my_liked_posts', JSON.stringify(updatedLikes));

        // UI 즉시 업데이트
        setComments(prev => prev.map(c => c.id === id ? { ...c, likes: c.likes + 1, likedBy: [userId] } : c));
        setLikedId(id);
        setTimeout(() => setLikedId(null), 1000);

        if(!id.startsWith("temp_")) {
          try {
            // 리액션 API 대신 댓글 생성 API를 사용하여 좋아요 기록 (누적 가능)
            await fetchGitHubAPI(`/issues/${id}/comments`, "POST", {
              body: `Liked by ${userId}`
            });
          } catch(e) { console.error("좋아요 동기화 실패", e); }
        }
      };

      return (
        <div className="flex flex-col h-full w-full select-none relative bg-slate-950 overflow-hidden" style={{ height: '100dvh' }}>
          {showToast && (
            <div className="fixed top-0 left-1/2 z-[600] animate-toast">
              <div className="bg-emerald-600 text-white px-8 py-3 rounded-full shadow-2xl font-bold flex items-center gap-3 border-2 border-emerald-300/50 whitespace-nowrap">
                <span>의견 등록 완료! 곧 화면에 나타납니다. 🚀</span>
              </div>
            </div>
          )}

          <div className="flex-1 overflow-hidden relative">
            {activeTab === 'mobile' && <MobileView addComment={addComment} />}
            {activeTab === 'screen' && <ScreenView comments={comments} toggleLike={toggleLike} isMobileScreen={isMobileScreen} userId={userId} likedId={likedId} />}
            {activeTab === 'admin' && <AdminView clearComments={() => {
              if(confirm("데이터를 초기화하시겠습니까?")) {
                setComments([]);
                localStorage.clear();
                fetchGitHubAPI("/issues?state=open").then(issues => {
                  issues.forEach(i => fetchGitHubAPI(`/issues/${i.number}`, "PATCH", { state: "closed" }));
                });
              }
            }} />}
          </div>

          <div className="bg-[#0f172a] flex justify-around p-2 pb-8 z-50 border-t border-slate-800 shrink-0 shadow-2xl pb-safe">
            <button onClick={() => setActiveTab('mobile')} className={`flex flex-col items-center p-2 rounded-xl flex-1 transition-all ${activeTab === 'mobile' ? 'text-emerald-400 bg-emerald-400/10' : 'text-slate-500'}`}>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
              <span className="text-[10px] font-bold">의견 등록</span>
            </button>
            <button onClick={() => setActiveTab('screen')} className={`flex flex-col items-center p-2 rounded-xl flex-1 transition-all ${activeTab === 'screen' ? 'text-emerald-400 bg-emerald-400/10' : 'text-slate-500'}`}>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
              <span className="text-[10px] font-bold">라이브 보드</span>
            </button>
            <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center p-2 rounded-xl flex-1 transition-all ${activeTab === 'admin' ? 'text-slate-200 bg-slate-700' : 'text-slate-600'}`}>
              <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              <span className="text-[10px] font-bold">관리자</span>
            </button>
          </div>
        </div>
      );
    }

    function MobileView({ addComment }) {
      const [nickname, setNickname] = useState('');
      const [content, setContent] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const handleSubmit = (e) => {
        e.preventDefault();
        if (!content.trim()) return;
        setIsSubmitting(true);
        addComment(nickname, content).then(() => {
          setContent('');
          setIsSubmitting(false);
        });
      };
      return (
        <div className="h-full w-full flex flex-col items-center justify-start p-4 bg-slate-50 overflow-y-auto">
          <div className="w-full max-w-md bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-200 mt-2">
            <div className="text-center mb-6">
              <img src="logo.png" className="h-10 mx-auto mb-4 object-contain" alt="logo" />
              <h2 className="text-xl font-black text-slate-800 tracking-tighter">워크샵 의견 등록</h2>
            </div>
            <form onSubmit={handleSubmit} className="flex flex-col gap-4">
              <div className="space-y-1">
                <label className="text-[10px] font-black text-emerald-600 uppercase tracking-widest ml-1">성함 또는 닉네임</label>
                <input type="text" placeholder="미입력시 익명" value={nickname} onChange={e=>setNickname(e.target.value)} className="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-emerald-500 transition-all text-base text-slate-900 font-bold" maxLength={10} />
              </div>
              <div className="space-y-1">
                <label className="text-[10px] font-black text-emerald-600 uppercase tracking-widest ml-1">내용</label>
                <textarea placeholder="의견을 입력해 주세요." value={content} onChange={e=>setContent(e.target.value)} className="w-full p-3 h-28 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-emerald-500 transition-all text-base text-slate-900 font-bold leading-relaxed resize-none" required />
              </div>
              <button type="submit" disabled={isSubmitting || !content.trim()} className="w-full bg-emerald-500 hover:bg-emerald-700 text-white font-black p-4 rounded-2xl active:scale-95 transition-all disabled:bg-slate-200 shadow-lg mt-2 text-base">
                {isSubmitting ? '보내는 중...' : '전광판 등록하기'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function ScreenView({ comments, toggleLike, isMobileScreen, userId, likedId }) {
      const colors = [
        'bg-white border-t-[10px] border-t-emerald-500',
        'bg-white border-t-[10px] border-t-teal-500',
        'bg-white border-t-[10px] border-t-emerald-400',
        'bg-slate-50 border-t-[10px] border-t-teal-400',
        'bg-white border-t-[10px] border-t-blue-500'
      ];
      
      const [heartDrops, setHeartDrops] = useState([]);

      useEffect(() => {
        if (likedId && !isMobileScreen) {
          const newDrops = Array.from({ length: 12 }).map((_, i) => ({
            id: Date.now() + i,
            left: Math.random() * 80 + 10,
            delay: Math.random() * 0.4
          }));
          setHeartDrops(prev => [...prev, ...newDrops]);
          setTimeout(() => {
            setHeartDrops(prev => prev.filter(d => !newDrops.find(nd => nd.id === d.id)));
          }, 2000);
        }
      }, [likedId, isMobileScreen]);

      if (isMobileScreen) {
        return (
          <div className="h-full flex flex-col w-full bg-slate-100">
            <div className="bg-emerald-600 p-3 px-5 shadow-lg flex flex-row justify-between items-center shrink-0">
              <img src="logo.png" className="h-6 object-contain brightness-0 invert" alt="logo" />
              <h2 className="font-black text-white tracking-widest uppercase text-[10px]">Opinion List</h2>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {comments.map(c => (
                <div key={c.id} className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200" onDoubleClick={() => toggleLike(c.id)}>
                  <span className="font-black text-[10px] text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full mb-3 inline-block uppercase">@ {c.nickname}</span>
                  <p className="text-slate-900 font-bold leading-relaxed mb-4 text-lg whitespace-pre-wrap">{c.content}</p>
                  <div className="flex justify-between items-center border-t border-slate-50 pt-4">
                    <span className="text-[10px] text-slate-300 font-black uppercase tracking-tighter">Double tap to like</span>
                    <button onClick={(e) => { e.stopPropagation(); toggleLike(c.id); }} className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-base font-black transition-all ${c.likedBy && c.likedBy.includes(userId) ? 'bg-emerald-500 text-white shadow-emerald-500/20' : 'bg-slate-100 text-slate-400'}`}>
                      {c.likedBy && c.likedBy.includes(userId) ? '💚' : '🤍'} {c.likes}
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div className="h-full bg-slate-900 overflow-hidden relative flex flex-col w-full">
          <div className="p-4 px-10 z-20 border-b border-slate-800 bg-slate-900/95 backdrop-blur-2xl flex justify-between items-center shrink-0 shadow-2xl">
            <div className="flex items-center gap-10">
              <img src="logo.png" alt="PharmaResearch" className="h-14 w-auto object-contain" />
              <div className="h-10 w-[2px] bg-slate-700/50 rounded-full"></div>
              <div>
                <h1 className="text-emerald-400 font-black text-2xl tracking-[0.1em] uppercase leading-none mb-1">Live Board</h1>
                <span className="text-slate-500 font-bold text-[10px] uppercase tracking-[0.4em] opacity-80">PharmaResearch Workshop</span>
              </div>
            </div>
            <div className="flex items-center gap-4 bg-slate-800/80 px-6 py-2 rounded-full border border-slate-700">
               <div className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_#10b981]"></div>
               <span className="text-slate-200 text-sm font-black uppercase tracking-widest">{comments.length} Messages</span>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-10 bg-[radial-gradient(circle_at_center,_#1e293b_0%,_#0f172a_100%)] scroll-smooth">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-10 auto-rows-max">
              {comments.map((c) => {
                const style = c.style || { colorIndex: 0 };
                const isThisPostLiked = likedId === c.id;
                const hasMeLiked = c.likedBy && c.likedBy.includes(userId);

                return (
                  <div 
                    key={c.id} 
                    onDoubleClick={() => toggleLike(c.id)} 
                    className="relative animate-card card-shadow p-8 rounded-[2.5rem] flex flex-col justify-between bg-white border-t-[10px] transition-all cursor-pointer border border-white/5 min-h-[220px]"
                    style={{ borderTopColor: colors[style.colorIndex].split('-').pop() === '500' ? '#10b981' : '#14b8a6' }}
                  >
                    {isThisPostLiked && heartDrops.map(drop => (
                      <div 
                        key={drop.id} 
                        className="falling-heart"
                        style={{ left: `${drop.left}%`, top: '-20px', animationDelay: `${drop.delay}s` }}
                      >
                        💚
                      </div>
                    ))}

                    <p className="text-xl font-black leading-tight break-words text-slate-900 mb-8 whitespace-pre-wrap tracking-tighter">"{c.content}"</p>
                    
                    <div className="flex justify-between items-center pt-5 border-t-2 border-slate-100 mt-auto">
                      <span className="font-black text-[11px] text-slate-500 truncate bg-slate-50 px-3 py-1.5 rounded-full max-w-[120px] border border-slate-100 uppercase tracking-widest">@ {c.nickname}</span>
                      <button onClick={(e) => { e.stopPropagation(); toggleLike(c.id); }} 
                        className={`flex items-center gap-2 hover:scale-110 px-5 py-2.5 rounded-full text-base font-black transition-all shadow-md ${hasMeLiked ? 'bg-emerald-500 text-white shadow-emerald-500/40' : 'bg-emerald-50 text-emerald-600 border border-emerald-100 hover:bg-emerald-100'}`}>
                        {hasMeLiked ? '💚' : '🤍'} <span>{c.likes}</span>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
            
            {comments.length === 0 && (
              <div className="h-full flex flex-col items-center justify-center pointer-events-none opacity-10 mt-20">
                <img src="logo.png" className="h-32 mb-10 grayscale invert" alt="logo" />
                <p className="text-4xl font-black uppercase tracking-[0.5em]">Waiting for opinions...</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function AdminView({ clearComments }) {
      const [pin, setPin] = useState('');
      const [auth, setAuth] = useState(false);
      if (!auth) return (
        <div className="h-full flex items-center justify-center p-6 bg-slate-900">
          <div className="bg-slate-800 p-12 rounded-[4rem] shadow-2xl text-center w-full max-w-sm border border-slate-700">
            <h1 className="text-xl font-black mb-8 uppercase tracking-widest text-emerald-400">Admin Control</h1>
            <input type="password" placeholder="PIN" value={pin} onChange={e=>setPin(e.target.value)} className="w-full p-4 bg-slate-900 border border-slate-700 rounded-3xl text-center text-3xl tracking-[0.5em] mb-6 text-white outline-none focus:border-emerald-500" />
            <button onClick={() => pin === ADMIN_PIN ? setAuth(true) : alert('실패')} className="w-full bg-emerald-500 text-white p-4 rounded-3xl font-black text-lg">LOGIN</button>
          </div>
        </div>
      );
      return (
        <div className="h-full flex items-center justify-center p-6 bg-slate-900 text-center shrink-0">
          <div className="max-sm w-full bg-slate-800 p-12 rounded-[4rem] shadow-2xl border border-slate-700">
            <h1 className="text-2xl font-black mb-10 uppercase tracking-widest text-white border-b border-slate-700 pb-6">Controls</h1>
            <button onClick={clearComments} className="w-full p-6 bg-rose-600 text-white font-black rounded-3xl shadow-xl active:scale-95 transition-all text-lg mb-4">RESET DATABASE</button>
            <p className="text-xs text-slate-500 font-bold uppercase tracking-tight opacity-50">GitHub Issues will be closed</p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
