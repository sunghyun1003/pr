<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>워크샵 라이브 월 (GitHub Edition)</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (브라우저에서 JSX 컴파일) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 폰트 추가 (스케치북 폰트) -->
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">

  <style>
    /* 글로벌 스타일 & 애니메이션 */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .handwriting { font-family: 'Nanum Pen Script', cursive; font-size: 1.5rem; line-height: 1.2; }
    
    @keyframes stickIt {
      0% { transform: scale(1.5) rotate(20deg); opacity: 0; filter: blur(5px); }
      50% { transform: scale(0.95) rotate(-2deg); opacity: 1; filter: blur(0px); }
      100% { transform: scale(1) rotate(var(--rotation)); opacity: 1; }
    }
    @keyframes likePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); color: #ec4899; }
      100% { transform: scale(1); }
    }
    @keyframes floatUp {
      0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -150px) scale(1.5); opacity: 0; }
    }
    
    .animate-stick-it { animation: stickIt 0.4s ease-out forwards; }
    .animate-like-pop { animation: likePop 0.3s ease-out; }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#0b1120] text-slate-800 m-0 p-0 overflow-hidden h-screen w-screen">
  <!-- React가 렌더링될 영역 -->
  <div id="root" class="h-full w-full"></div>

  <!-- 메인 React 컴포넌트 로직 -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // =====================================================================
    // ⚠️ [필수 수정 사항] ⚠️
    // 본인의 GitHub 정보로 아래 항목들을 채워넣어야 작동합니다!
    // =====================================================================
    const GITHUB_OWNER = "sunghyun1003"; // 예: "kim-dev"
    const GITHUB_REPO = "pr";        // 예: "workshop-wall"
    
    // 중요: GitHub은 보안을 위해 토큰이 코드에 그대로 올라가는 것을 차단합니다. (Secret Scanning)
    // 봇의 스캔을 피하기 위해, 발급받으신 토큰을 대략 반으로 나누어서 입력해 주세요.
    // (예: 토큰이 ghp_1234567890abcdef 라면)
    const TOKEN_PART_1 = "ghp_khDbGMZTeisRu8qRB";  // 예: "ghp_12345678"
    const TOKEN_PART_2 = "FTXN4Yi1snyPD1DhrvI"; // 예: "90abcdef"
    
    // 이 코드가 실행될 때 두 문자열을 합쳐서 실제 토큰으로 사용합니다.
    // * 실제 운영시에는 코드를 열어보면 토큰이 노출되는 구조이므로, 
    //   사내 행사 등 신뢰할 수 있는 분들에게만 QR코드를 공유해 주세요!
    const GITHUB_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
    // =====================================================================

    // API 호출 헬퍼 함수
    const fetchGitHubAPI = async (path, method = "GET", body = null) => {
      const headers = {
        "Accept": "application/vnd.github.v3+json",
        "Authorization": `token ${GITHUB_TOKEN}`
      };
      const options = { method, headers };
      if (body) { options.body = JSON.stringify(body); }

      const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}${path}`, options);
      if (!response.ok) throw new Error("GitHub API Error");
      return response.json();
    };

    function App() {
      const [activeTab, setActiveTab] = useState('mobile'); 
      const [comments, setComments] = useState([]);
      const [isMobileScreen, setIsMobileScreen] = useState(window.innerWidth < 768);
      const [userId, setUserId] = useState('');
      const [isLoading, setIsLoading] = useState(true);

      // 기기 ID 생성 및 화면 리사이즈 감지
      useEffect(() => {
        let storedUserId = localStorage.getItem('workshop_user_id');
        if (!storedUserId) {
          storedUserId = 'user_' + Math.random().toString(36).substr(2, 9);
          localStorage.setItem('workshop_user_id', storedUserId);
        }
        setUserId(storedUserId);

        const handleResize = () => setIsMobileScreen(window.innerWidth < 768);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // 1. GitHub Issues에서 데이터 불러오기 (Polling 방식)
      const loadComments = useCallback(async () => {
        if(GITHUB_OWNER === "YOUR_GITHUB_USERNAME") return; // 세팅 안되었으면 패스

        try {
          // 상태가 'open'인 이슈만 가져옴
          const issues = await fetchGitHubAPI("/issues?state=open&per_page=100");
          
          const formattedComments = await Promise.all(issues.map(async (issue) => {
            // 해당 이슈의 Reactions(하트) 개수 가져오기
            const likesCount = issue.reactions ? issue.reactions.heart : 0;
            
            // 본문 파싱
            const content = issue.body || "";
            const isPaused = issue.labels.some(l => l.name === 'paused'); // 정지 상태 체크용
            
            return {
              id: issue.number.toString(),
              nickname: issue.title || "익명",
              content: content,
              likes: likesCount,
              likedBy: [], // 프론트엔드 캐시용
            };
          }));

          // 프론트엔드의 랜덤 스타일 유지를 위해 기존 데이터를 덮어쓰되, 스타일은 유지
          setComments(prev => {
            return formattedComments.map(newC => {
              const oldC = prev.find(p => p.id === newC.id);
              if (oldC) {
                return { ...newC, style: oldC.style, likedBy: oldC.likedBy };
              } else {
                // 새 글이면 위치 계산
                return {
                  ...newC,
                  style: {
                    rotation: Math.random() * 30 - 15,
                    colorIndex: Math.floor(Math.random() * 5),
                    scale: Math.random() * 0.1 + 0.95, 
                    left: Math.random() * 70 + 5,
                    top: Math.random() * 60 + 10,
                  }
                };
              }
            });
          });
        } catch (error) {
          console.error("데이터 로드 실패:", error);
        } finally {
          setIsLoading(false);
        }
      }, []);

      // 3초마다 데이터 갱신
      useEffect(() => {
        loadComments();
        const interval = setInterval(loadComments, 3000);
        return () => clearInterval(interval);
      }, [loadComments]);


      // 2. 새 댓글 작성 -> GitHub Issue 생성
      const addComment = async (nickname, content) => {
        // 즉각적인 UI 반영 (낙관적 업데이트)
        const tempId = "temp_" + Date.now();
        const newComment = {
          id: tempId, nickname: nickname || '익명', content, likes: 0, likedBy: [],
          style: { rotation: Math.random() * 30 - 15, colorIndex: Math.floor(Math.random() * 5), scale: 1, left: Math.random() * 70 + 5, top: Math.random() * 60 + 10 }
        };
        setComments(prev => [newComment, ...prev]);

        // GitHub API 호출
        if(GITHUB_OWNER !== "YOUR_GITHUB_USERNAME") {
          try {
            await fetchGitHubAPI("/issues", "POST", {
              title: nickname || "익명",
              body: content
            });
            // 생성 완료 후 다시 로드
            loadComments();
          } catch(e) { alert("글 등록에 실패했습니다. (API 오류)"); }
        }
      };

      // 3. 좋아요 클릭 -> GitHub Reaction 추가
      const toggleLike = async (id) => {
        // 내 폰에서는 이미 눌렀으면 리턴 (1인 1회 제한)
        const target = comments.find(c => c.id === id);
        if(!target || target.likedBy.includes(userId)) return;

        // UI 즉각 반영
        setComments(prev => prev.map(c => c.id === id ? { ...c, likes: c.likes + 1, likedBy: [...c.likedBy, userId] } : c));

        // GitHub API 호출 (Reaction - Heart)
        if(GITHUB_OWNER !== "YOUR_GITHUB_USERNAME" && !id.startsWith("temp_")) {
          try {
            await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues/${id}/reactions`, {
              method: "POST",
              headers: {
                "Accept": "application/vnd.github.squirrel-girl-preview+json", 
                "Authorization": `token ${GITHUB_TOKEN}`
              },
              body: JSON.stringify({ content: "heart" })
            });
          } catch(e) { console.error("좋아요 실패", e); }
        }
      };

      // 4. 어드민: 전체 삭제 -> GitHub 이슈 전부 Close 처리
      const clearComments = async () => {
        setComments([]);
        if(GITHUB_OWNER !== "YOUR_GITHUB_USERNAME") {
          try {
             // 열려있는 이슈들을 모두 가져와서 state를 'closed'로 변경
             const issues = await fetchGitHubAPI("/issues?state=open");
             for(const issue of issues) {
               await fetchGitHubAPI(`/issues/${issue.number}`, "PATCH", { state: "closed" });
             }
             alert("전체 삭제 완료");
          } catch(e) { alert("삭제 실패"); }
        }
      };

      // =========================================================================
      // 아래부터는 UI 렌더링 코드
      // =========================================================================
      return (
        <div className="flex flex-col h-full w-full select-none">
          {GITHUB_OWNER === "YOUR_GITHUB_USERNAME" && (
             <div className="bg-red-600 text-white p-3 text-center text-sm font-bold z-[100]">
               ⚠️ 소스 코드(index.html)에서 GITHUB_OWNER, REPO, TOKEN_PART 값을 수정해야 작동합니다!
             </div>
          )}

          <div className="flex-1 overflow-hidden relative bg-slate-50">
            {activeTab === 'mobile' && <MobileView addComment={addComment} />}
            {activeTab === 'screen' && <ScreenView comments={comments} toggleLike={toggleLike} isMobileScreen={isMobileScreen} userId={userId} />}
            {activeTab === 'admin' && <AdminView clearComments={clearComments} />}
          </div>

          <div className="bg-slate-900 flex justify-around p-2 pb-6 z-50">
            <button onClick={() => setActiveTab('mobile')} className={`flex flex-col items-center p-2 rounded-xl flex-1 ${activeTab === 'mobile' ? 'text-indigo-400 bg-slate-800' : 'text-slate-500'}`}>
              <span className="text-2xl mb-1">📱</span><span className="text-[11px] font-bold">입력하기</span>
            </button>
            <button onClick={() => setActiveTab('screen')} className={`flex flex-col items-center p-2 rounded-xl flex-1 ${activeTab === 'screen' ? 'text-pink-400 bg-slate-800' : 'text-slate-500'}`}>
              <span className="text-2xl mb-1">📽️</span><span className="text-[11px] font-bold">결과보기</span>
            </button>
            <button onClick={() => setActiveTab('admin')} className={`flex flex-col items-center p-2 rounded-xl flex-1 ${activeTab === 'admin' ? 'text-fuchsia-400 bg-slate-800' : 'text-slate-500'}`}>
              <span className="text-2xl mb-1">⚙️</span><span className="text-[11px] font-bold">관리자</span>
            </button>
          </div>
        </div>
      );
    }

    // --- 참여자 폰 화면 (MobileView) ---
    function MobileView({ addComment }) {
      const [nickname, setNickname] = useState('');
      const [content, setContent] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!content.trim()) return;
        setIsSubmitting(true);
        
        addComment(nickname, content);
        
        setContent('');
        setIsSubmitting(false);
        alert('전광판으로 메시지가 전송되었습니다! 🚀');
      };

      return (
        <div className="h-full w-full flex flex-col items-center justify-center p-4">
          <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
            <div className="text-center mb-8">
              <span className="text-5xl block mb-2">🚀</span>
              <h2 className="text-2xl font-black text-slate-800">의견 남기기</h2>
            </div>
            <form onSubmit={handleSubmit} className="flex flex-col gap-4">
              <input type="text" placeholder="닉네임 (선택)" value={nickname} onChange={e=>setNickname(e.target.value)} className="w-full p-4 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500" maxLength={10} />
              <textarea placeholder="자유롭게 의견을 적어주세요!" value={content} onChange={e=>setContent(e.target.value)} className="w-full p-4 h-32 bg-slate-50 rounded-xl outline-none resize-none focus:ring-2 focus:ring-indigo-500" required />
              <button type="submit" disabled={isSubmitting || !content.trim()} className="w-full bg-indigo-600 text-white font-bold p-4 rounded-xl mt-4 active:scale-95 transition-transform disabled:bg-slate-300">
                {isSubmitting ? '전송 중...' : '전광판으로 쏘기 🚀'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // --- 전광판/리스트 화면 (ScreenView) ---
    function ScreenView({ comments, toggleLike, isMobileScreen, userId }) {
      const colors = ['bg-yellow-100 border-yellow-200', 'bg-pink-100 border-pink-200', 'bg-blue-100 border-blue-200', 'bg-green-100 border-green-200', 'bg-purple-100 border-purple-200'];

      const handleLikeClick = (id) => {
         toggleLike(id);
         if (isMobileScreen) {
             const heart = document.createElement('div');
             heart.innerHTML = '❤️';
             heart.style.cssText = 'position:fixed; left:50%; bottom:150px; font-size:40px; animation:floatUp 1s ease-out forwards; z-index:9999; transform:translateX(-50%); pointer-events:none;';
             document.body.appendChild(heart);
             setTimeout(() => heart.remove(), 1000);
         }
      }

      if (isMobileScreen) {
        // 모바일 리스트 뷰
        return (
          <div className="h-full flex flex-col w-full bg-slate-50">
            <div className="bg-white p-4 shadow-sm border-b text-center"><h2 className="font-black text-slate-800">전체 의견 리스트</h2></div>
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {comments.map(c => {
                 const hasLiked = c.likedBy.includes(userId);
                 return (
                  <div key={c.id} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100" onDoubleClick={() => handleLikeClick(c.id)}>
                    <span className="font-bold text-xs text-slate-600 bg-slate-100 px-2 py-1 rounded-md mb-2 block w-fit">@ {c.nickname}</span>
                    <p className="text-slate-800 font-medium leading-relaxed mb-4">{c.content}</p>
                    <div className="flex justify-between items-center border-t pt-3">
                      <span className="text-[10px] text-slate-400">더블클릭하여 좋아요</span>
                      <button onClick={(e) => { e.stopPropagation(); handleLikeClick(c.id); }} className={`px-3 py-1.5 rounded-full text-sm font-bold transition-all ${hasLiked ? 'bg-pink-500 text-white' : 'bg-pink-50 text-pink-600'}`}>
                        {hasLiked ? '🤍' : '❤️'} {c.likes}
                      </button>
                    </div>
                  </div>
                )
              })}
            </div>
          </div>
        );
      }

      // PC 전광판 뷰 (스케치북)
      return (
        <div className="h-full bg-slate-800 overflow-hidden relative flex flex-col w-full">
          <div className="p-8 z-20 pointer-events-none">
            <h1 className="text-4xl md:text-5xl font-black text-white drop-shadow-xl mb-2">LIVE WORKSHOP 🚀</h1>
            <span className="text-slate-200 bg-slate-900/50 px-3 py-1.5 rounded-lg">더블클릭하여 좋아요! (총 {comments.length}개)</span>
          </div>

          <div className="flex-1 relative overflow-hidden z-10 w-full h-full">
            {comments.map((c) => {
              const style = c.style || { rotation: 0, colorIndex: 0, scale: 1, left: 50, top: 50 };
              const colorClass = colors[style.colorIndex];
              const hasLiked = c.likedBy.includes(userId);

              return (
                <div key={c.id} onDoubleClick={() => handleLikeClick(c.id)} className={`absolute animate-stick-it border border-black/10 shadow-xl p-6 rounded-lg flex flex-col justify-between ${colorClass} hover:z-50 hover:scale-105 cursor-pointer`}
                  style={{ '--rotation': `${style.rotation}deg`, left: `${style.left}%`, top: `${style.top}%`, transform: `scale(${style.scale}) rotate(${style.rotation}deg)`, width: '300px', minHeight: '150px' }}>
                  <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-12 h-6 bg-white/40 shadow-sm rotate-2 border border-white/30"></div>
                  <p className="handwriting text-3xl font-bold leading-relaxed break-words relative z-10 mb-4 text-slate-900">"{c.content}"</p>
                  <div className="flex justify-between items-center pt-3 border-t border-black/10 relative z-10 mt-auto">
                    <span className="font-bold text-sm opacity-70">@ {c.nickname}</span>
                    <button onClick={(e) => { e.stopPropagation(); handleLikeClick(c.id); }} className={`flex items-center gap-1 hover:scale-110 px-2 py-1 rounded-full shadow-sm text-sm transition-all ${hasLiked ? 'bg-pink-500 text-white' : 'bg-white/60 text-slate-700 hover:bg-white'}`}>
                      {hasLiked ? '🤍' : '❤️'} <span className="font-bold">{c.likes}</span>
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- 관리자 화면 (AdminView) ---
    function AdminView({ clearComments }) {
      const [showConfirm, setShowConfirm] = useState(false);
      return (
        <div className="h-full bg-slate-100 p-5 overflow-y-auto w-full flex items-center justify-center">
          <div className="w-full max-w-md bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center">
            <span className="text-4xl block mb-4">⚙️</span>
            <h1 className="text-xl font-black text-slate-800 mb-8">관리자 컨트롤 패널</h1>
            
            {!showConfirm ? (
              <button onClick={() => setShowConfirm(true)} className="w-full p-4 bg-red-50 text-red-600 font-bold rounded-xl flex items-center justify-center gap-2 border border-red-200">
                <span className="text-xl">🗑️</span> 전광판 전체 삭제 (Issue Close)
              </button>
            ) : (
              <div className="bg-red-50 p-4 rounded-xl border border-red-200">
                <p className="text-red-700 font-bold mb-4">정말 모두 삭제하시겠습니까?</p>
                <div className="flex gap-2">
                  <button onClick={() => setShowConfirm(false)} className="flex-1 py-3 bg-white border font-bold rounded-lg">취소</button>
                  <button onClick={() => { clearComments(); setShowConfirm(false); }} className="flex-1 py-3 bg-red-600 text-white font-bold rounded-lg">삭제</button>
                </div>
              </div>
            )}
            <p className="text-xs text-slate-400 mt-4">* 삭제 시 GitHub 저장소의 해당 Issue들이 모두 Closed(종료) 처리됩니다.</p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
